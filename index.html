  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

1.25\">\n              <div style=\"color:#FF6B1A;font-size:15px;letter-spacing:2px\">★★★★★<\u002Fdiv>\n              <div style=\"font-size:14px;font-weight:600;color:#E8E3DB\"><span style=\"font-weight:800;color:#F3F0EA\">+100<\u002Fspan> restaurantes atendidos<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div id=\"form\" ref=\"{{ formRef }}\" style=\"grid-area:form;min-width:0;align-self:start;position:{{ formPos }};top:20px;scroll-margin-top:16px\">\n          <div style=\"background:#121112;border:1px solid #2A2522;border-radius:20px;padding:24px 20px;box-shadow:0 30px 80px -30px rgba(255,107,26,0.25)\">\n            <sc-if value=\"{{ notSuccess }}\" hint-placeholder-val=\"{{ true }}\">\n              <h2 style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:23px;line-height:1.15;letter-spacing:-0.01em;margin:0 0 8px;text-wrap:balance\">Cadastre agora e venha ser Impacto.<\u002Fh2>\n              <p style=\"margin:0 0 20px;font-size:14.5px;color:#B5AFA6;line-height:1.45\">Nossa equipe entra em contato com você imediatamente.<\u002Fp>\n              <form sc-camel-on-submit=\"{{ onSubmit }}\" sc-camel-no-validate=\"\" style=\"display:flex;flex-direction:column;gap:12px\">\n                <label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#D9D4CC\">Nome\n                  <input value=\"{{ f.nome }}\" sc-camel-on-change=\"{{ on.nome }}\" placeholder=\"Seu nome\" sc-camel-auto-complete=\"name\" style=\"height:48px;border-radius:10px;border:1.5px solid {{ bc.nome }};background:#1A1819;color:#F3F0EA;padding:0 14px;font-size:16px;outline:none\" style-focus=\"border-color:#FF6B1A\">\n                <\u002Flabel>\n                <label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#D9D4CC\">WhatsApp\n                  <input value=\"{{ f.whats }}\" sc-camel-on-change=\"{{ on.whats }}\" placeholder=\"(00) 00000-0000\" sc-cam \">{{ errMsg }}<\u002Fdiv>\n                <\u002Fsc-if>\n                <button type=\"submit\" disabled=\"{{ sending }}\" style=\"margin-top:6px;height:56px;border:none;border-radius:12px;background:#FF6B1A;color:#0A0A0B;font-weight:800;font-size:17px;cursor:pointer;box-shadow:0 10px 30px -10px rgba(255,107,26,0.7)\" style-hover=\"background:#FF8A45\">{{ btnLabel }}<\u002Fbutton>\n              <\u002Fform>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ success }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:28px 4px;text-align:center\">\n                <div style=\"width:60px;height:60px;border-radius:50%;background:#FF6B1A;color:#0A0A0B;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;margin:0 auto 18px\">✓<\u002Fdiv>\n                <p style=\"font-family:'Archivo',sans-serif;font-weight:800;font-size:22px;line-height:1.25;margin:0;text-wrap:balance\">Recebemos seu cadastro! Em breve um especialista vai falar com você pelo WhatsApp.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"grid-area:video;min-width:0;display:flex;justify-content:{{ videoJustify }}\">\n          <div style=\"position:relative;width:100%;max-width:300px;aspect-ratio:9/16;border-radius:20px;overflow:hidden;border:1px solid #2A2522;background:repeating-linear-gradient(135deg,#17151A 0 10px,#121014 10px 20px)\">\n            <div style=\"position:absolute;top:14px;left:14px;background:#FF6B1A;color:#0A0A0B;font-size:12px;font-weight:800;padding:6px 10px;border-radius:8px\">Resultado do cliente aqui<\u002Fdiv>\n            <div style=\"position:absolute;top:50%;left:50%;transform:translate(-50%,-60%);font-family:ui-monospace,monospace;font-size:11px;color:#6E6A64;text-align:center;width:80%;margin-top:70px\">vídeo de depoimento (9:16)<\u002Fdiv>\n            <div style=\"position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:68px;height:68px;border-radius:50%;background:rgba(255,107,26,0.95);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 10px rgba(255,107,26,0.18)\">\n              <div style=\"width:0;height:0;border-left:20px solid #0A0A0B;border-top:12px solid transparent;border-bottom:12px solid transparent;margin-left:5px\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"position:absolute;left:0;right:0;bottom:0;padding:40px 16px 16px;background:linear-gradient(transparent,rgba(0,0,0,0.85));font-size:13.5px;font-weight:600\">Nome do Cliente · <span style=\"color:#B5AFA6;font-weight:500\">Restaurante, Cidade/UF<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"depoimentos\" style=\"padding:64px 20px;border-top:1px solid #1C1A19;scroll-margin-top:8px\">\n    <div style=\"max-width:1180px;margin:0 auto\">\n      <h2 style=\"font-family:'Archivo',sans-serif;font-weight:900;font-size:clamp(28px,5.4vw,44px);line-height:1.05;letter-spacing:-0.02em;margin:0 0 32px;max-width:720px;text-wrap:balance\">O que os donos de restaurante falam da <span style=\"color:#FF6B1A\">Impacto<\u002Fspan><\u002Fh2>\n      <div style=\"display:grid;gap:14px;grid-auto-flow:{{ tFlow }};grid-auto-columns:84%;grid-template-columns:{{ tCols }};overflow-x:{{ tOverflow }};scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -20px;padding:0 20px 4px;scroll-padding:0 20px\">\n        <sc-for list=\"{{ testimonials }}\" as=\"t\" hint-placeholder-count=\"4\">\n          <div style=\"scroll-snap-align:start;background:#121112;border:1px solid #242020;border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:18px\">\n            <div style=\"color:#FF6B1A;font-size:16px;letter-spacing:3px\">★★★★★<\u002Fdiv>\n            <p style=\"margin:0;font-size:16px;line-height:1.5;color:#E8E3DB;flex:1\">“{{ t.text }}”<\u002Fp>\n            <div style=\"display:flex;align-items:center;gap:12px\">\n              <div style=\"width:42px;height:42px;border-radius:50%;background:rgba(255,107,26,0.14);border:1px solid rgba(255,107,26,0.4);color:#FF6B1A;font-weight:800;display:flex;align-items:center;justify-content:center;font-family:'Archivo',sans-serif\">N<\u002Fdiv>\n              <div style=\"line-height:1.3\">\n                <div style=\"font-weight:700;font-size:14.5px\">Nome do Cliente<\u002Fdiv>\n                <div style=\"font-size:13px;color:#9C968D\">Restaurante · Cidade/UF<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <sc-if value=\"{{ isMobile }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;justify-content:center;gap:6px;margin-top:14px\">\n          <sc-for list=\"{{ dots }}\" as=\"d\" hint-placeholder-count=\"4\">\n            <div style=\"width:6px;height:6px;border-radius:3px;background:#3A332D\"><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <div style=\"display:none\">\n        <sc-for list=\"{{ videos }}\" as=\"v\" hint-placeholder-count=\"0\">\n          <div style=\"position:relative;aspect-ratio:9/16;border-radius:14px;overflow:hidden;border:1px solid #2A2522;background:repeating-linear-gradient(135deg,#17151A 0 10px,#121014 10px 20px)\">\n            <div style=\"position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;background:rgba(255,107,26,0.95);display:flex;align-items:center;justify-content:center\">\n              <div style=\"width:0;height:0;border-left:14px solid #0A0A0B;border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"position:absolute;bottom:10px;left:0;right:0;text-align:center;font-family:ui-monospace,monospace;font-size:10px;color:#6E6A64\">vídeo {{ v }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <a href=\"#form\" style=\"display:inline-block;margin-top:32px;background:#FF6B1A;color:#0A0A0B;font-weight:800;font-size:16px;padding:16px 28px;border-radius:12px;box-shadow:0 10px 30px -10px rgba(255,107,26,0.7)\" style-hover=\"background:#FF8A45;color:#0A0A0B\">Falar com especialista<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"padding:64px 20px;border-top:1px solid #1C1A19;background:radial-gradient(500px 340px at 90% 10%, rgba(255,107,26,0.09), transparent 70%)\">\n    <div style=\"max-width:860px;margin:0 auto\">\n      <h2 style=\"font-family:'Archivo',sans-serif;font-weight:900;font-size:clamp(30px,6vw,48px);line-height:1.02;letter-spacing:-0.02em;margin:0 0 12px\">O Método <span style=\"color:#FF6B1A\">Impacto<\u002Fspan><\u002Fh2>\n      <p style=\"margin:0 0 30px;font-size:16.5px;line-height:1.5;color:#B5AFA6;max-width:560px\">Uma metodologia feita só para delivery. Toque em cada etapa para ver como funciona.<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"5\">\n          <div style=\"background:#121112;border:1px solid {{ s.border }};border-radius:16px;overflow:hidden\">\n            <button type=\"button\" sc-camel-on-click=\"{{ s.toggle }}\" style=\"width:100%;display:flex;align-items:center;gap:14px;background:none;border:none;color:#F3F0EA;padding:16px 18px;cursor:pointer;text-align:left;min-height:64px\">\n              <span style=\"flex:none;width:40px;height:40px;border-radius:10px;background:{{ s.badgeBg }};color:{{ s.badgeColor }};border:1px solid #FF6B1A;font-family:'Archivo',sans-serif;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center\">{{ s.n }}<\u002Fspan>\n              <span style=\"flex:1;font-family:'Archivo',sans-serif;font-weight:800;font-size:15.5px;letter-spacing:0.04em\">{{ s.title }}<\u002Fspan>\n              <span style=\"flex:none;color:#FF6B1A;font-size:24px;font-weight:400;line-height:1;width:20px;text-align:center\">{{ s.icon }}<\u002Fspan>\n            <\u002Fbutton>\n            <sc-if value=\"{{ s.open }}\" hint-placeholder-val=\"{{ false }}\">\n              <p style=\"margin:0;padding:0 18px 20px 72px;font-size:15.5px;line-height:1.6;color:#C9C3BA\">{{ s.text }}<\u002Fp>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <a href=\"#form\" style=\"display:inline-block;margin-top:32px;background:#FF6B1A;color:#0A0A0B;font-weight:800;font-size:16px;padding:16px 28px;border-radius:12px;box-shadow:0 10px 30px -10px rgba(255,107,26,0.7)\" style-hover=\"background:#FF8A45;color:#0A0A0B\">Falar com especialista<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"padding:64px 20px;border-top:1px solid #1C1A19\">\n    <div style=\"max-width:1180px;margin:0 auto\">\n      <h2 style=\"font-family:'Archivo',sans-serif;font-weight:900;font-size:clamp(28px,5.4vw,44px);line-height:1.05;letter-spacing:-0.02em;margin:0 0 18px;max-width:820px;text-wrap:balance\">A Impacto é uma equipe inteira trabalhando pelo <span style=\"color:#FF6B1A\">seu delivery<\u002Fspan><\u002Fh2>\n      <p style=\"margin:0 0 36px;font-size:17px;line-height:1.6;color:#C9C3BA;max-width:680px\">Não é um gestor de tráfego sozinho. É uma estrutura com estratégia, criação e gestão de anúncios, com experiência em restaurantes de delivery e foco em uma coisa: fazer o seu restaurante receber mais pedidos.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:#242020;border:1px solid #242020;border-radius:18px;overflow:hidden;margin-bottom:28px\">\n        <sc-for list=\"{{ stats }}\" as=\"st\" hint-placeholder-count=\"4\">\n          <div style=\"background:#0F0E0F;padding:24px 20px\">\n            <div style=\"font-family:'Archivo',sans-serif;font-weight:900;font-size:clamp(28px,4.4vw,40px);line-height:1;color:#FF6B1A;letter-spacing:-0.02em;margin-bottom:8px\">{{ st.n }}<\u002Fdiv>\n            <div style=\"font-size:14.5px;line-height:1.4;color:#F3F0EA\">{{ st.l }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"aspect-ratio:16/9;max-height:520px;width:100%;border-radius:18px;border:1px solid #2A2522;background:repeating-linear-gradient(135deg,#17151A 0 10px,#121014 10px 20px);display:flex;align-items:center;justify-content:center;font-family:ui-monospace,monospace;font-size:12px;color:#6E6A64\">foto ou vídeo da equipe<\u002Fdiv>\n      <a href=\"#form\" style=\"display:inline-block;margin-top:32px;background:#FF6B1A;color:#0A0A0B;font-weight:800;font-size:16px;padding:16px 28px;border-radius:12px;box-shadow:0 10px 30px -10px rgba(255,107,26,0.7)\" style-hover=\"background:#FF8A45;color:#0A0A0B\">Falar com especialista<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"padding:40px 20px {{ footerPad }};border-top:1px solid #1C1A19;background:#070708\">\n    <div style=\"max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px;font-size:14px;color:#9C968D;line-height:1.5\">\n      <img src=\"4244fe8c-8a0d-468e-b717-4d7a2f768d9a\" alt=\"Impacto\" style=\"height:26px;width:auto;align-self:flex-start\">\n      <div>Impacto Marketing e Tecnologia · CNPJ: [CNPJ]<\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:6px 20px\">\n        <a href=\"https://instagram.com/impactobrasiloficial\" target=\"_blank\" rel=\"noopener\">Instagram: @impactobrasiloficial<\u002Fa>\n        <a href=\"mailto:diretoria@impactobrasiloficial.com\">diretoria@impactobrasiloficial.com<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"font-size:13px;color:#6E6A64\">Todos os direitos reservados.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n  <sc-if value=\"{{ showSticky }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;left:0;right:0;bottom:0;z-index:50;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(10,10,11,0.95) 35%)\">\n      <a href=\"#form\" style=\"display:block;text-align:center;background:#FF6B1A;color:#0A0A0B;font-weight:800;font-size:16px;padding:16px;border-radius:12px;box-shadow:0 10px 30px -8px rgba(255,107,26,0.6)\">Falar com especialista<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\n// Substitua esta função pela integração com CRM/webhook.\nasync function submitLead(data) {\n  console.log('[lead]', data);\n  await new Promise(r => setTimeout(r, 700));\n  return { ok: true };\n}\n// Dispara o evento Lead do Meta Pixel (o pixel base vai no <head>).\nfunction trackLead(data) {\n  if (typeof window !== 'undefined' && typeof window.fbq === 'function') {\n    window.fbq('track', 'Lead', { content_category: data.segmento });\n  }\n}\nfunction maskPhone(v) {\n  const d = v.replace(/\\D/g, '').slice(0, 11);\n  if (d.length <= 2) return d.length ? '(' + d : '';\n  if (d.length <= 6) return '(' + d.slice(0, 2) + ') ' + d.slice(2);\n  if (d.length <= 10) return '(' + d.slice(0, 2) + ') ' + d.slice(2, 6) + '-' + d.slice(6);\n  return '(' + d.slice(0, 2) + ') ' + d.slice(2, 7) + '-' + d.slice(7);\n}\nconst FIELDS = ['nome', 'whats', 'rest', 'seg', 'fat', 'invest'];\nconst STEPS = [\n  ['01', 'TRÁFEGO PAGO', 'Anúncios no Instagram e no Facebook mostrados para quem mora perto do seu restaurante, com campanhas separadas para almoço, noite e dias mais fracos. Criativos novos toda semana e ajustes semanais para colocar a verba no que traz pedido.'],\n  ['02', 'CARDÁPIO QUE VENDE', 'Fotos, descrições e ordem dos itens pensadas para facilitar a escolha e levar o cliente até o pedido. Quem chega pelo anúncio encontra um cardápio que convence, não só uma lista de produtos.'],\n  ['03', 'IFOOD ESTRUTURADO', 'Fotos, descrições, destaques e promoções do app organizados para o seu restaurante aparecer mais e vender mais dentro do iFood.'],\n  ['04', 'INSTAGRAM QUE VENDE', 'Perfil e posts pensados para gerar vontade de pedir, não só curtida. Quem vê o anúncio e entra no seu perfil encontra motivo para pedir agora.'],\n  ['05', 'AUMENTO DE TICKET MÉDIO', 'Combos, promoções e ofertas planejadas todo mês, incluindo as datas comerciais, para cada cliente gastar mais por pedido.']\n];\nconst TESTIMONIALS = [\n  'Depoimento do cliente sobre o aumento de pedidos no delivery após começar com a Impacto.',\n  'Depoimento do cliente sobre como o restaurante passou a ser mais conhecido na cidade.',\n  'Depoimento do cliente sobre o acompanhamento da equipe e a clareza dos resultados.',\n  'Depoimento do cliente sobre o crescimento das vendas e do ticket médio.'\n];\n\nclass Component extends DCLogic {\n  state = {\n    w: typeof window !== 'undefined' ? window.innerWidth : 1200,\n    open: 0,\n    f: { nome: '', whats: '', rest: '', seg: '', fat: '', invest: '' },\n    err: {}, status: 'idle', formVisible: false, triedSubmit: false\n  };\n  formRef = React.createRef();\n\n  componentDidMount() {\n    this.onResize = () => this.setState({ w: window.innerWidth });\n    window.addEventListener('resize', this.onResize);\n    this.io = new IntersectionObserver(([e]) => this.setState({ formVisible: e.isIntersecting }), { threshold: 0.1 });\n    this.observe();\n  }\n  componentDidUpdate() { this.observe(); }\n  observe() {\n    const el = this.formRef.current;\n    if (el && el !== this.observed) { this.io.disconnect(); this.io.observe(el); this.observed = el; }\n  }\n  componentWillUnmount() { window.removeEventListener('resize', this.onResize); this.io && this.io.disconnect(); }\n\n  validate(f) {\n    const err = {};\n    FIELDS.forEach(k => { if (!String(f[k]).trim()) err[k] = true; });\n    if (f.whats.replace(/\\D/g, '').length < 10) err.whats = true;\n    return err;\n  }\n  setField(k, v) {\n    this.setState(s => {\n      const f = { ...s.f, [k]: k === 'whats' ? maskPhone(v) : v };\n      return { f, err: s.triedSubmit ? this.validate(f) : {} };\n    });\n  }\n  onSubmit = async (e) => {\n    e.preventDefault();\n    const { f } = this.state;\n    const err = this.validate(f);\n    if (Object.keys(err).length) { this.setState({ err, triedSubmit: true }); return; }\n    const data = {\n      nome: f.nome.trim(), whatsapp: f.whats, restaurante: f.rest.trim(),\n      segmento: f.seg, faturamento: f.fat, investiria_1000: f.invest\n    };\n    this.setState({ status: 'sending', err: {} });\n    try {\n      await submitLead(data);\n      trackLead(data);\n      this.setState({ status: 'success' });\n    } catch (x) {\n      this.setState({ status: 'idle', err: { _net: true } });\n    }\n  };\n\n  renderVals() {\n    const { w, open, f, err, status, formVisible } = this.state;\n    const desktop = w >= 960;\n    const on = {}, bc = {}, sc = {};\n    FIELDS.forEach(k => {\n      on[k] = e => this.setField(k, e.target.value);\n      bc[k] = err[k] ? '#FF6B4A' : '#2E2A28';\n    });\n    ['seg', 'fat', 'invest'].forEach(k => { sc[k] = f[k] ? '#F3F0EA' : '#6E6A64'; });\n    const errKeys = Object.keys(err);\n    return {\n      chips: ['Tráfego pago', 'Instagram que vende', 'Aumento de ticket médio'],\n      avatars: [0, 1, 2, 3].map(i => ({ ml: i ? '-10px' : '0' })),\n      heroCols: desktop ? 'minmax(0,1.15fr) minmax(0,0.85fr)' : 'minmax(0,1fr)',\n      heroAreas: desktop ? '\"copy form\" \"video form\"' : '\"copy\" \"form\" \"video\"',\n      formPos: desktop ? 'sticky' : 'relative',\n      videoJustify: desktop ? 'flex-start' : 'center',\n      formRef: this.formRef,\n      f, on, bc, sc,\n      onSubmit: this.onSubmit,\n      notSuccess: status !== 'success',\n      success: status === 'success',\n      sending: status === 'sending',\n      btnLabel: status === 'sending' ? 'Enviando…' : 'Cadastrar Agora',\n      hasErr: errKeys.length > 0,\n      errMsg: err._net ? 'Não foi possível enviar. Tente novamente.' : (err.whats && errKeys.length === 1 ? 'Informe um WhatsApp válido com DDD.' : 'Preencha todos os campos destacados.'),\n      testimonials: TESTIMONIALS.map(text => ({ text })),\n      tFlow: desktop ? 'row' : 'column',\n      tCols: desktop ? 'repeat(4,minmax(0,1fr))' : 'none',\n      tOverflow: desktop ? 'visible' : 'auto',\n      isMobile: !desktop,\n      dots: [1, 2, 3, 4],\n      videos: [],\n      steps: STEPS.map(([n, title, text], i) => {\n        const o = open === i;\n        return {\n          n, title, text, open: o, icon: o ? '−' : '+',\n          border: o ? 'rgba(255,107,26,0.45)' : '#242020',\n          badgeBg: o ? '#FF6B1A' : 'rgba(255,107,26,0.08)',\n          badgeColor: o ? '#0A0A0B' : '#FF6B1A',\n          toggle: () => this.setState(s => ({ open: s.open === i ? -1 : i }))\n        };\n      }),\n      stats: [\n        { n: '5 anos', l: 'de mercado' },\n        { n: '+150', l: 'clientes ativos' },\n        { n: '+100', l: 'restaurantes atendidos' },\n        { n: 'R$ 1 milhão', l: 'investidos em anúncios para clientes' }\n      ],\n      showSticky: !desktop && !formVisible && status !== 'success',\n      footerPad: desktop ? '40px' : '110px'\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
